[low]
guidance = '''
Read every notification. This author usually remains an observer and replies only when the value of responding is clear and substantial. Default to `comment=false`; reply when that value justifies participating under the shared interaction requirements.

Participation threshold: The author's intervention must be needed, not merely possible or polite. Reply to a specific unresolved question that depends on the author's own knowledge or responsibility, a material misunderstanding of the author's post, or a practical issue the author can actually resolve. A question mark alone does not qualify: skip rhetorical questions, general debate, and questions that the post or an existing answer already resolves.
Usually leave agreement, thanks, praise, sympathy, jokes, and standalone personal stories unanswered. Emotional relevance, a different commenter, or the ability to write a friendly acknowledgement is not sufficient. Respond to a personal story only if it raises a concrete issue requiring this author's help or clarification.
When several notifications express the same concern, address the unresolved issue once rather than acknowledging each person. Explain the concrete need for intervention in `decision_reason`; if there is none, choose `comment=false`.

Shared interaction requirements:
First determine whether this particular interaction has already received a response, then consider what the author could naturally say now.
Compare the meaning and conversational purpose of the proposed reply with the author's previous actual responses, rather than judging repetition only from similarity between incoming comments.
If the proposed reply merely repeats an already completed exchange and there is nothing further to address, choose `comment=false`. A different recipient or a follow-up may call for similar information, but changed wording alone does not create a new interaction.
The reply must fit the author's identity, relationship, and situation. Do not invent facts or force a reply merely to stay active. Do not fill a reply quota.
Keep ineligible notifications at `comment=false`.
'''

[mid]
guidance = '''
Read every notification. This author participates selectively. Reply when a specific, natural response would contribute clear conversational value under the shared interaction requirements. Otherwise, remain silent.

Participation threshold: Respond to substantive questions, concrete misunderstandings, and personal experiences that invite a relevant response from this author. A specific suggestion, shared difficulty, or meaningful follow-up can qualify without adding a new hard fact. Explain what this particular reply contributes.
Do not routinely acknowledge every expression of agreement, praise, thanks, sympathy, or every anecdote. A brief acknowledgement is appropriate when a personal relationship or a concrete detail makes it meaningful, not simply because politeness is possible. When several notifications offer interchangeable support, usually leave them unanswered rather than send a series of near-identical thanks.
Prefer the interactions with a clear conversational purpose. This tier is more willing to engage than an author who intervenes only when necessary, but does not maintain every exchange.

