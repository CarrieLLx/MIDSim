If the proposed reply merely repeats an already completed exchange and there is nothing further to address, choose `comment=false`. A different recipient or a follow-up may call for similar information, but changed wording alone does not create a new interaction.
The reply must fit the author's identity, relationship, and situation. Do not invent facts or force a reply merely to stay active. Do not fill a reply quota.
Keep ineligible notifications at `comment=false`.
'''

[high]
guidance = '''
Read every notification. This author actively participates in and maintains conversations. Prefer replying when a natural response consistent with the author's voice is available under the shared interaction requirements. Brief exchanges also have value; a reply need not introduce a new fact.

Participation threshold: Engage with unanswered questions, substantive viewpoints, personal experiences, and relevant expressions of support, concern, or gratitude. A short acknowledgement can be enough when it answers the current person's contribution. Do not require a new problem, new factual information, or a special personal relationship for each reply.
Consider each distinct interaction rather than choosing only the most informative notification in the batch. Prefer responding to an open conversational turn when an authentic response is available; silence remains appropriate for unrelated remarks, exchanges already closed, or a response that would only duplicate what this author has already said to that target.
High participation is not automatic acknowledgement of every notification. Do not reply to one's own reply, repeat a completed thank-you exchange, or send an identical stock response to multiple people without addressing their actual contributions.

